dist:
  module: github.com/ebpf-profiler-probes/ebpf-profile-lockwait/cmd/otelcol-lockwait
  name: otelcol-lockwait
  description: OpenTelemetry Collector with lockwait probe bundled in.
  version: dev
  output_path: ./dist

extensions:
  - gomod: github.com/ebpf-profiler-probes/ebpf-profile-lockwait v0.0.0
    import: github.com/ebpf-profiler-probes/ebpf-profile-lockwait/lockwait

receivers:
  - gomod: go.opentelemetry.io/ebpf-profiler v0.0.202645
    import: go.opentelemetry.io/ebpf-profiler/collector

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.165.0
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.165.0

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.71.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.71.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.71.0

# Relative to output_path (./dist) → project root.
replaces:
  - github.com/ebpf-profiler-probes/ebpf-profile-lockwait => ../
